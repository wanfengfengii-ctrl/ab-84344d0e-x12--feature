# Partner profile registry, shared by both services: the api enforces it on
# requests carrying X-Partner-Profile, verify derives its match/reject
# scenarios from the same document.  Must be a JSON array of 1..16 unique
# profiles; see README.md ("合作方画像") for the schema.  An invalid document
# makes the api process exit non-zero at startup.
x-partner-profiles: &partner-profiles >-
  [
    {
      "name": "acme-po",
      "isa05": "ZZ", "isa06": "ACME-SENDER", "isa07": "ZZ", "isa08": "HUB-RECEIVER",
      "gs02": "ACMEAPP", "gs03": "HUBAPP",
      "groups": [
        {"gs01": "PO", "gs08": "005010", "st01": ["850", "855"]},
        {"gs01": "IN", "gs08": "004010", "st01": ["810"]}
      ]
    },
    {
      "name": "retail-ship",
      "isa05": "01", "isa06": "RETAILER", "isa07": "01", "isa08": "HUB-RECEIVER",
      "gs02": "RETAILAPP", "gs03": "HUBAPP",
      "groups": [
        {"gs01": "SH", "gs08": "005010", "st01": ["856"]}
      ]
    }
  ]

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: x12-audit-api:latest
    environment:
      # In-container listen settings; the host-side published port is
      # controlled below via HOST_PORT.
      PORT: "8080"
      HOST: "0.0.0.0"
      LOG_LEVEL: "INFO"
      X12_PARTNER_PROFILES: *partner-profiles
    ports:
      # Host port is configurable: HOST_PORT=9090 docker compose up
      - "${HOST_PORT:-8080}:8080"
    healthcheck:
      # Inherits the image HEALTHCHECK conceptually, restated here so
      # readiness gating is explicit and editable in compose.
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 1s
    restart: unless-stopped

  verify:
    build:
      context: .
      dockerfile: Dockerfile
    image: x12-audit-api:latest
    command: ["python", "-m", "scripts.verify"]
    environment:
      BASE_URL: "http://api:8080"
      HEALTH_TIMEOUT: "60"
      X12_PARTNER_PROFILES: *partner-profiles
    depends_on:
      api:
        condition: service_healthy
    # One-shot: never restarted; its exit code aggregates all checks.
    restart: "no"
