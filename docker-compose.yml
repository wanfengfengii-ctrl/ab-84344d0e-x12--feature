services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: x12-audit-api:latest
    environment:
      # In-container listen settings; the host-side published port is
      # controlled below via HOST_PORT.
      PORT: "8080"
      HOST: "0.0.0.0"
      LOG_LEVEL: "INFO"
      # Trading-partner profiles (1..16 unique entries).  Each entry
      # declares ISA05/06/07/08, GS02/03 and 1..8 group contracts of
      # GS01 + GS08 + allowed ST01 codes.  Selected per request with the
      # X-Partner-Profile header; absent/blank disables profiling.
      X12_PARTNER_PROFILES: |-
        [
          {
            "name": "acme",
            "ISA05": "ZZ", "ISA06": "SENDER",
            "ISA07": "ZZ", "ISA08": "PARTNER",
            "GS02": "SENDER", "GS03": "PARTNER",
            "groups": [
              {"GS01": "PO", "GS08": "005010", "ST01": ["850", "855"]}
            ]
          },
          {
            "name": "beta",
            "ISA05": "ZZ", "ISA06": "BETA",
            "ISA07": "ZZ", "ISA08": "PARTNER",
            "GS02": "BETA", "GS03": "PARTNER",
            "groups": [
              {"GS01": "FA", "GS08": "005010", "ST01": ["997", "999"]}
            ]
          }
        ]
    ports:
      # Host port is configurable: HOST_PORT=9090 docker compose up
      - "${HOST_PORT:-8080}:8080"
    healthcheck:
      # Inherits the image HEALTHCHECK conceptually, restated here so
      # readiness gating is explicit and editable in compose.
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 1s
    restart: unless-stopped

  verify:
    build:
      context: .
      dockerfile: Dockerfile
    image: x12-audit-api:latest
    command: ["python", "-m", "scripts.verify"]
    environment:
      BASE_URL: "http://api:8080"
      HEALTH_TIMEOUT: "60"
    depends_on:
      api:
        condition: service_healthy
    # One-shot: never restarted; its exit code aggregates all checks.
    restart: "no"
